<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استخراج فواتير PDF و الصور إلى Excel</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh}
        .header{background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid #1e3a5f;padding:18px 32px;display:flex;align-items:center;justify-content:space-between}
        .header h1{font-size:20px;color:#38bdf8;display:flex;align-items:center;gap:10px}
        .header .conn{display:flex;align-items:center;gap:6px;font-size:13px;color:#64748b}
        .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;transition:background .3s}
        .dot.on{background:#22c55e}
        .main{max-width:1100px;margin:0 auto;padding:24px}
        .card{background:#111827;border:1px solid #1e3a5f;border-radius:12px;margin-bottom:20px;overflow:hidden}
        .card-head{padding:16px 20px;border-bottom:1px solid #1e3a5f;display:flex;align-items:center;justify-content:space-between}
        .card-head h2{font-size:15px;color:#f1f5f9;display:flex;align-items:center;gap:8px}
        .card-head h2 .icon{width:20px;height:20px}
        .card-body{padding:20px}
        .input-group{display:flex;gap:10px;margin-bottom:16px}
        .input-group input{flex:1;padding:12px 16px;background:#0a0f1e;border:1px solid #1e3a5f;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;direction:ltr;text-align:left;outline:none;transition:border-color .2s}
        .input-group input:focus{border-color:#38bdf8}
        .input-group input::placeholder{color:#475569;direction:rtl;text-align:right}
        .btn{padding:11px 22px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit;white-space:nowrap}
        .btn-blue{background:#38bdf8;color:#0a0f1e}
        .btn-blue:hover{background:#7dd3fc}
        .btn-green{background:#22c55e;color:#0a0f1e}
        .btn-green:hover{background:#4ade80}
        .btn-red{background:#ef4444;color:#fff}
        .btn-red:hover{background:#f87171}
        .btn-gray{background:#334155;color:#94a3b8}
        .btn-gray:hover{background:#475569;color:#e2e8f0}
        .btn:disabled{opacity:.4;cursor:not-allowed}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
        select{padding:12px 16px;background:#0a0f1e;border:1px solid #1e3a5f;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;outline:none;cursor:pointer}
        select:focus{border-color:#38bdf8}
        .scan-result{background:#0a0f1e;border-radius:8px;padding:16px;margin-top:12px;display:none}
        .scan-result.show{display:block}
        .file-list{max-height:200px;overflow:auto;border:1px solid #1e3a5f;border-radius:8px}
        .file-item{padding:8px 12px;border-bottom:1px solid #0f172a;font-size:13px;display:flex;justify-content:space-between;color:#94a3b8}
        .file-item:last-child{border-bottom:none}
        .file-item .name{color:#e2e8f0}
        .file-item .size{color:#64748b;font-size:12px}
        .progress-wrap{margin-top:16px;display:none}
        .progress-wrap.show{display:block}
        .progress-track{width:100%;height:8px;background:#1e293b;border-radius:4px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#818cf8);border-radius:4px;transition:width .3s;width:0}
        .progress-info{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#64748b}
        .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
        .stat{background:#0a0f1e;border:1px solid #1e3a5f;border-radius:8px;padding:14px;text-align:center}
        .stat .val{font-size:26px;font-weight:700;color:#38bdf8}
        .stat .lbl{font-size:11px;color:#64748b;margin-top:4px}
        .stat.green .val{color:#22c55e}
        .stat.red .val{color:#ef4444}
        .stat.yellow .val{color:#f59e0b}
        .log{background:#0a0f1e;border:1px solid #1e3a5f;border-radius:8px;max-height:200px;overflow:auto;padding:10px;font-family:'Courier New',monospace;font-size:12px;color:#64748b;line-height:1.8}
        .log .ok{color:#22c55e}
        .log .err{color:#ef4444}
        .log .info{color:#38bdf8}
        .toast{position:fixed;bottom:20px;left:20px;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:1000;transform:translateY(80px);opacity:0;transition:all .3s}
        .toast.show{transform:translateY(0);opacity:1}
        .toast.ok{background:#22c55e;color:#0a0f1e}
        .toast.err{background:#ef4444;color:#fff}
        .toast.info{background:#38bdf8;color:#0a0f1e}
        .actions{display:flex;gap:8px;flex-wrap:wrap}
        .divider{height:1px;background:#1e3a5f;margin:16px 0}
        @media(max-width:768px){.stat-row{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-3{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            استخراج فواتير PDF و الصور إلى Excel
        </h1>
        <div class="conn"><div class="dot" id="dot"></div><span id="connTxt">غير متصل</span></div>
    </div>

    <div class="main">
        <!-- Step 1: Folder Selection -->
        <div class="card">
            <div class="card-head">
                <h2>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    1. اختر المجلد الذي يحتوي على ملفات PDF والصور
                </h2>
            </div>
            <div class="card-body">
                <div class="input-group">
                    <input type="text" id="folderPath" placeholder="C:\Users\...\invoices - الصق مسار المجلد هنا">
                    <button class="btn btn-blue" onclick="scanFolder()">مسح المجلد</button>
                </div>
                <div class="grid-2">
                    <div class="scan-result" id="scanResult">
                        <div class="stat-row" style="margin-bottom:0">
                            <div class="stat"><div class="val" id="fileCount">0</div><div class="lbl">ملف</div></div>
                            <div class="stat"><div class="val" id="pdfCount">0</div><div class="lbl">PDF</div></div>
                            <div class="stat"><div class="val" id="imgCount">0</div><div class="lbl">صور</div></div>
                            <div class="stat"><div class="val" id="totalSize">0</div><div class="lbl">MB</div></div>
                        </div>
                    </div>
                </div>
                <div class="file-list" id="fileList" style="display:none"></div>
            </div>
        </div>

        <!-- Step 2: Processing Settings -->
        <div class="card">
            <div class="card-head">
                <h2>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    2. إعدادات المعالجة
                </h2>
            </div>
            <div class="card-body">
                <div class="grid-3">
                    <div>
                        <label style="font-size:13px;color:#94a3b8;display:block;margin-bottom:6px">عدد العمليات المتوازية</label>
                        <select id="workers">
                            <option value="2">2 عملية</option>
                            <option value="4" selected>4 عمليات</option>
                            <option value="8">8 عمليات</option>
                            <option value="12">12 عملية</option>
                            <option value="16">16 عملية</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size:13px;color:#94a3b8;display:block;margin-bottom:6px">لغة OCR</label>
                        <select id="ocrLang">
                            <option value="ara+eng" selected>عربي + إنجليزي</option>
                            <option value="eng">إنجليزي فقط</option>
                            <option value="ara">عربي فقط</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size:13px;color:#94a3b8;display:block;margin-bottom:6px">&nbsp;</label>
                        <div class="actions">
                            <button class="btn btn-green" id="btnStart" disabled onclick="startProcess()">ابدأ الاستخراج</button>
                            <button class="btn btn-red" id="btnStop" disabled onclick="stopProcess()">إيقاف</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 3: Progress -->
        <div class="card" id="progressCard" style="display:none">
            <div class="card-head">
                <h2>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
                    3. المعالجة جارية...
                </h2>
            </div>
            <div class="card-body">
                <div class="stat-row">
                    <div class="stat"><div class="val" id="pDone">0</div><div class="lbl">تم</div></div>
                    <div class="stat yellow"><div class="val" id="pTotal">0</div><div class="lbl">الإجمالي</div></div>
                    <div class="stat green"><div class="val" id="pPercent">0%</div><div class="lbl">التقدم</div></div>
                    <div class="stat red"><div class="val" id="pErrors">0</div><div class="lbl">أخطاء</div></div>
                    <div class="stat"><div class="val" id="pRate">0</div><div class="lbl">ملف/ث</div></div>
                </div>
                <div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
                <div class="progress-info">
                    <span id="pElapsed">المنقضي: 0s</span>
                    <span id="pCurrent">--</span>
                    <span id="pRemaining">المتبقي: --</span>
                </div>
                <div class="log" id="logBox" style="margin-top:12px"></div>
            </div>
        </div>

        <!-- Step 4: Download -->
        <div class="card" id="resultCard" style="display:none">
            <div class="card-head">
                <h2>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    4. تحميل ملف Excel الناتج
                </h2>
            </div>
            <div class="card-body">
                <div class="stat-row" style="margin-bottom:0">
                    <div class="stat green"><div class="val" id="rRows">0</div><div class="lbl">سطر مستخرج</div></div>
                    <div class="stat"><div class="val" id="rFile">--</div><div class="lbl">اسم الملف</div></div>
                </div>
                <div class="divider"></div>
                <div class="actions" style="justify-content:center">
                    <button class="btn btn-green" id="btnDownload" onclick="downloadResult()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        تحميل ملف Excel
                    </button>
                    <button class="btn btn-blue" onclick="resetAll()">معالجة ملفات جديدة</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = location.origin;
        let scannedFiles = [];
        let pollTimer = null;
        let currentOutput = null;

        async function checkConn() {
            try {
                const r = await fetch(`${API}/api/scan-folder`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({folder: '.'})
                });
                document.getElementById('dot').classList.add('on');
                document.getElementById('connTxt').textContent = 'متصل بالخادم';
            } catch {
                document.getElementById('dot').classList.remove('on');
                document.getElementById('connTxt').textContent = 'غير متصل - شغّل server.py أولاً';
            }
        }

        async function scanFolder() {
            const folder = document.getElementById('folderPath').value.trim();
            if (!folder) { toast('أدخل مسار المجلد', 'err'); return; }

            try {
                const r = await fetch(`${API}/api/scan-folder`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({folder})
                });
                const d = await r.json();
                if (d.error) { toast(d.error, 'err'); return; }

                scannedFiles = d.files;
                document.getElementById('scanResult').classList.add('show');
                document.getElementById('fileCount').textContent = d.count;
                document.getElementById('pdfCount').textContent = d.files.filter(f=>f.ext==='.pdf').length;
                document.getElementById('imgCount').textContent = d.files.filter(f=>f.ext!=='.pdf').length;
                document.getElementById('totalSize').textContent = d.total_size_mb;

                const list = document.getElementById('fileList');
                list.style.display = 'block';
                list.innerHTML = d.files.slice(0, 200).map(f =>
                    `<div class="file-item"><span class="name">${f.name}</span><span class="size">${(f.size/1024).toFixed(0)} KB</span></div>`
                ).join('') + (d.files.length > 200 ? `<div class="file-item"><span class="name">... و ${d.files.length - 200} ملف آخر</span></div>` : '');

                document.getElementById('btnStart').disabled = false;
                toast(`تم العثور على ${d.count} ملف`, 'info');
            } catch (e) {
                toast('خطأ في الاتصال بالخادم', 'err');
            }
        }

        async function startProcess() {
            const folder = document.getElementById('folderPath').value.trim();
            const workers = parseInt(document.getElementById('workers').value);
            const lang = document.getElementById('ocrLang').value;

            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
            document.getElementById('progressCard').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            addLog('info', 'بدء المعالجة...');

            try {
                const r = await fetch(`${API}/api/process`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({folder, workers, lang})
                });
                const d = await r.json();
                if (d.error) {
                    toast(d.error, 'err');
                    document.getElementById('btnStart').disabled = false;
                    return;
                }
                addLog('ok', d.message);
                startPolling();
            } catch (e) {
                toast('خطأ في بدء المعالجة', 'err');
                document.getElementById('btnStart').disabled = false;
            }
        }

        function startPolling() {
            pollTimer = setInterval(async () => {
                try {
                    const r = await fetch(`${API}/api/process-status`);
                    const s = await r.json();

                    document.getElementById('pDone').textContent = s.done;
                    document.getElementById('pTotal').textContent = s.total;
                    document.getElementById('pPercent').textContent = s.percent + '%';
                    document.getElementById('pErrors').textContent = s.errors;
                    document.getElementById('pRate').textContent = s.rate;
                    document.getElementById('pFill').style.width = s.percent + '%';
                    document.getElementById('pElapsed').textContent = 'المنقضي: ' + s.elapsed;
                    document.getElementById('pRemaining').textContent = 'المتبقي: ' + s.remaining;
                    document.getElementById('pCurrent').textContent = s.current_file ? 'الآن: ' + s.current_file : '';

                    if (s.error_count > 0) {
                        const er = await fetch(`${API}/api/errors`);
                        const ed = await er.json();
                        const errs = ed.errors.slice(-5);
                        errs.forEach(e => addLog('err', `${e.file}: ${e.error}`));
                    }

                    if (!s.running) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        document.getElementById('btnStop').disabled = true;
                        addLog('ok', 'انتهت المعالجة!');

                        if (s.output_file) {
                            currentOutput = s.output_file;
                            document.getElementById('resultCard').style.display = 'block';
                            document.getElementById('rRows').textContent = s.done - s.errors;
                            document.getElementById('rFile').textContent = s.output_file;
                            toast('تم بنجاح! جاهز للتحميل', 'ok');
                        } else {
                            toast('لم يتم استخراج بيانات', 'err');
                            document.getElementById('btnStart').disabled = false;
                        }
                    }
                } catch {}
            }, 500);
        }

        async function stopProcess() {
            try {
                await fetch(`${API}/api/stop`, {method:'POST'});
                clearInterval(pollTimer);
                pollTimer = null;
                document.getElementById('btnStop').disabled = true;
                document.getElementById('btnStart').disabled = false;
                addLog('err', 'تم الإيقاف يدوياً');
                toast('تم إيقاف المعالجة', 'info');
            } catch {}
        }

        function downloadResult() {
            if (!currentOutput) return;
            window.open(`${API}/api/download?file=${encodeURIComponent(currentOutput)}`, '_blank');
        }

        function resetAll() {
            scannedFiles = [];
            currentOutput = null;
            document.getElementById('scanResult').classList.remove('show');
            document.getElementById('fileList').style.display = 'none';
            document.getElementById('progressCard').style.display = 'none';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('btnStart').disabled = true;
            document.getElementById('logBox').innerHTML = '';
            addLog('info', 'جاهز لمعالجة ملفات جديدة');
        }

        function addLog(type, msg) {
            const box = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString('ar-SA');
            box.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        checkConn();
        addLog('info', 'جاهز - أدخل مسار المجلد الذي يحتوي على ملفات PDF والصور');
    </script>
</body>
</html>
